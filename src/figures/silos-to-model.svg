<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" class="fig-silos-to-model" role="img" aria-label="Two halves. Left, today: four operational systems — Historian, Maintenance, Work permits and ERP — sit in separate boxes with no connections between them and question marks in every gap, while one person joins them by hand for each project. Right, with a shared model: the same four sources all flow into a single shared model, where the historian tag, the maintenance equipment number and the ERP asset are joined up as one pump.">

<text class="fig-title" x="20" y="24">From four systems to one picture</text>
<text class="fig-sub" x="20" y="44">The same four sources, before and after there is a model to join them to.</text>

<path class="fig-track" d="M 380 64 L 380 342"/>

<text class="fig-box-title" x="32" y="78">Today</text>
<text class="fig-box-sub" x="32" y="96">four systems, four ideas of a pump</text>

<text class="fig-box-title" x="396" y="78">With a shared model</text>
<text class="fig-box-sub" x="396" y="96">every source joins to one description</text>

<g>
  <rect class="fig-box" x="32" y="112" width="152" height="54" rx="12"/>
  <text class="fig-box-title" x="108" y="134" text-anchor="middle">Historian</text>
