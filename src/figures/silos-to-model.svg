</g>
<g>
  <rect class="fig-box" x="32" y="186" width="152" height="54" rx="12"/>
  <text class="fig-box-title" x="108" y="208" text-anchor="middle">Work permits</text>
  <text class="fig-box-sub" x="108" y="225" text-anchor="middle">permit on the pump</text>
</g>
<g>
  <rect class="fig-box" x="202" y="186" width="152" height="54" rx="12"/>
  <text class="fig-box-title" x="278" y="208" text-anchor="middle">ERP</text>
  <text class="fig-box-sub" x="278" y="225" text-anchor="middle">cost-centre asset</text>
</g>

<g>
  <text class="fig-title" x="193" y="144" text-anchor="middle">?</text>
  <text class="fig-title" x="193" y="218" text-anchor="middle">?</text>
