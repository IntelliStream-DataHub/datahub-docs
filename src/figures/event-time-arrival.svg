<text class="fig-box-sub" x="476" y="108" text-anchor="middle">four hours of readings, spread across four hours</text>
<text class="fig-box-sub" x="712" y="228" text-anchor="end">the same four hours, inside one window</text>
<text class="fig-box-sub" x="476" y="284" text-anchor="middle">nothing arriving: the link is down</text>
<text class="fig-box-sub" x="150" y="310" text-anchor="middle">08:00</text>
<text class="fig-box-sub" x="313" y="310" text-anchor="middle">10:00</text>
<text class="fig-box-sub" x="476" y="310" text-anchor="middle">12:00</text>
<text class="fig-box-sub" x="639" y="310" text-anchor="middle">14:00</text>
<text class="fig-sub" x="20" y="338">Window on the time a reading carries and the morning is where it belongs. Window on the time it</text>
<text class="fig-sub" x="20" y="356">arrived and you have invented a quiet morning and a violent afternoon, out of data containing neither.</text>
</svg>