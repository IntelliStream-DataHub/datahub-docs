<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" class="fig-event-time-arrival" role="img" aria-label="Two lanes sharing a time axis. On the top lane nine readings are evenly spaced from eight to two. On the bottom lane the first three arrive immediately, then nothing arrives for four hours while the link is down, and the remaining six land together just after two. Connecting lines fan from the top lane into that burst.">
<text class="fig-title" x="20" y="24">When it happened is not when it turned up</text>
<text class="fig-sub" x="20" y="44">The same nine readings, once by the time they carry and once by the time they landed.</text>
<text class="fig-box-title" x="20" y="142">When it</text>
<text class="fig-box-title" x="20" y="158">happened</text>
<text class="fig-box-title" x="20" y="262">When it</text>
<text class="fig-box-title" x="20" y="278">arrived</text>
<line class="fig-track" x1="150" y1="138" x2="720" y2="138"/>
<line class="fig-track" x1="150" y1="258" x2="720" y2="258"/>
