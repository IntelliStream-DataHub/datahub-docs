<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" class="fig-blast-radius" role="img" aria-label="A chiller at the left, feeding a loop, which feeds three cooling units, which serve three groups of racks. Two groups also have a second path from an unaffected loop; the third group of six racks does not, and is highlighted.">
<text class="fig-title" x="20" y="24">One traversal answers what actually breaks</text>
