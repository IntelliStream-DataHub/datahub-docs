<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" class="fig-events-series" role="img" aria-label="One pressure trace with three moments marked. The first crosses a limit and raises an alarm. The second stays inside the limit but changes shape, and raises an anomaly. The third settles at a new level and records a change of condition. Each becomes an event underneath the chart.">
<text class="fig-title" x="20" y="24">Three reasons the same trace becomes an event</text>
<text class="fig-sub" x="20" y="44">The series keeps every reading. An event records the moment something decided a reading mattered.</text>
