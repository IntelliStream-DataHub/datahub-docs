<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" class="fig-features-image" role="img" aria-label="Four panels. A grid of pixels, then the edges found in it, then the shapes those edges form, a ring with a pointer and tick marks, and finally the object itself, recognised as a pressure gauge with a confidence score.">
<text class="fig-title" x="20" y="24">The same idea, on a photograph</text>
<text class="fig-sub" x="20" y="44">Nobody writes down what a gauge looks like. Each panel is built out of the one to its left.</text>
<text class="fig-box-title" x="95" y="82" text-anchor="middle">Pixels</text>
<text class="fig-box-sub" x="95" y="240" text-anchor="middle">brightness at a point,</text>
<text class="fig-box-sub" x="95" y="256" text-anchor="middle">and nothing else</text>
<text class="fig-box-title" x="280" y="82" text-anchor="middle">Edges</text>
<text class="fig-box-sub" x="280" y="240" text-anchor="middle">where the brightness</text>
<text class="fig-box-sub" x="280" y="256" text-anchor="middle">changes, and which way</text>
<path class="fig-exit-path fig-flow" d="M170 146 L194 146" fill="none"/>
<path class="fig-centre" d="M194 141 L205 146 L194 151 z"/>
<text class="fig-box-title" x="465" y="82" text-anchor="middle">Shapes</text>
<text class="fig-box-sub" x="465" y="240" text-anchor="middle">edges that keep company:</text>
<text class="fig-box-sub" x="465" y="256" text-anchor="middle">a ring, a pointer, ticks</text>
<path class="fig-exit-path fig-flow" d="M355 146 L379 146" fill="none"/>
<path class="fig-centre" d="M379 141 L390 146 L379 151 z"/>
<text class="fig-box-title" x="650" y="82" text-anchor="middle">An object</text>
<text class="fig-box-sub" x="650" y="240" text-anchor="middle">a name, and how sure</text>
<text class="fig-box-sub" x="650" y="256" text-anchor="middle">the model is of it</text>
