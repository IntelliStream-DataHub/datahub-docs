<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" class="fig-aliasing-illusion" role="img" aria-label="Two panels sampling the same fast signal. On the left, sampled fast enough, the reconstructed curve follows every oscillation. On the right, sampled too slowly, the genuine measurement dots trace out a smooth slow wave that does not exist in the real signal, the aliasing illusion.">
