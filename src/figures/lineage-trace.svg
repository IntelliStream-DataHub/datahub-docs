<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" class="fig-lineage-trace" role="img" aria-label="A reported KPI traced back through an hourly aggregate, a filter by event window and a clean or gap-fill step, to two raw sensor series and a maintenance event. The calculation runs left to right; the trace runs right to left.">
<text class="fig-title" x="20" y="24">Tracing a figure back to its inputs</text>
<text class="fig-sub" x="20" y="44">The calculation runs left to right. The trace runs the other way, naming what each step consumed.</text>
<g><rect class="fig-box" x="11" y="60" width="130" height="58" rx="12"/><text class="fig-box-title" x="76" y="86" text-anchor="middle">Sensor A</text><text class="fig-box-sub" x="76" y="104" text-anchor="middle">raw samples</text></g>
<g><rect class="fig-box" x="11" y="132" width="130" height="58" rx="12"/><text class="fig-box-title" x="76" y="158" text-anchor="middle">Sensor B</text><text class="fig-box-sub" x="76" y="176" text-anchor="middle">gap-filled</text></g>
<circle class="fig-token fig-pulse" cx="133" cy="140" r="7"/>
<g><rect class="fig-box" x="163" y="96" width="130" height="58" rx="12"/><text class="fig-box-title" x="228" y="122" text-anchor="middle">Clean</text><text class="fig-box-sub" x="228" y="140" text-anchor="middle">and gap-fill</text></g>
<g><rect class="fig-box" x="315" y="96" width="130" height="58" rx="12"/><text class="fig-box-title" x="380" y="122" text-anchor="middle">Filter</text><text class="fig-box-sub" x="380" y="140" text-anchor="middle">by event window</text></g>
<g><rect class="fig-box" x="467" y="96" width="130" height="58" rx="12"/><text class="fig-box-title" x="532" y="122" text-anchor="middle">Aggregate</text><text class="fig-box-sub" x="532" y="140" text-anchor="middle">hourly</text></g>
<g><rect class="fig-lit-box c-blue" x="619" y="96" width="130" height="58" rx="12"/><text class="fig-lit-title" x="684" y="122" text-anchor="middle">Reported KPI</text><text class="fig-lit-sub" x="684" y="140" text-anchor="middle">with its evidence</text></g>
<g><rect class="fig-box" x="163" y="214" width="130" height="58" rx="12"/><text class="fig-box-title" x="228" y="240" text-anchor="middle">Maintenance</text><text class="fig-box-sub" x="228" y="258" text-anchor="middle">event</text></g>
<path class="fig-track" d="M141 89 L163 125" fill="none"/>
<path class="fig-track" d="M141 161 L163 125" fill="none"/>
<path class="fig-track" d="M293 125 L315 125" fill="none"/>
<path class="fig-track" d="M293 243 L355 154" fill="none"/>
<path class="fig-track" d="M445 125 L467 125" fill="none"/>
<path class="fig-track" d="M597 125 L619 125" fill="none"/>
<path class="fig-exit-path fig-trace" d="M619 125 L597 125 M467 125 L445 125 M315 125 L293 125 M163 125 L141 89" fill="none"/>
<text class="fig-box-sub" x="684" y="82" text-anchor="middle">start here</text>
<text class="fig-box-sub" x="20" y="300">Each step names the inputs it consumed, so the walk ends on real samples rather than on an assumption.</text>
</svg>