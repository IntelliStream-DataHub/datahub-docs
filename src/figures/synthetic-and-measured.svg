<text class="fig-box-sub" x="400" y="192">as many as the training needs, with the conditions varied</text>
<rect class="fig-exit-box" x="20" y="228" width="720" height="72" rx="14"/><text class="fig-exit-title" x="40" y="254">Train on both. Test only on what was actually measured.</text><text class="fig-exit-sub" x="40" y="274">Keep the generated data in its own data set, labelled, so the two can never be confused later,</text><text class="fig-exit-sub" x="40" y="290">by a person, by a report, or by the next model that comes looking for training data.</text>
