<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" class="fig-synthetic-measured" role="img" aria-label="Two timelines. The measured one holds three examples of a failure in ten years. The synthetic one holds hundreds, generated from a model of how the failure develops. Below, the two rules: train on both, test only on measured, and keep them in separate data sets.">
<text class="fig-title" x="20" y="24">The failures you most want to predict are the ones you have barely seen</text>
<text class="fig-sub" x="20" y="44">Nothing learns a pattern from three examples. Generating more is how that stops being a dead end.</text>
<text class="fig-box-title" x="20" y="96">Measured</text>
<text class="fig-box-sub" x="20" y="114">ten years of real history</text>
