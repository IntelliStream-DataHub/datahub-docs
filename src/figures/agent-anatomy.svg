<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" class="fig-agent-anatomy" role="img" aria-label="An agent in the middle, with six parts around it: a goal and its sub-goals, a plain-language interface and memory on the left; tools, a planner and judgement on the right. A loop mark on the agent shows that it repeats.">
<text class="fig-title" x="20" y="24">Six parts, and the loop that makes them an agent</text>
<text class="fig-sub" x="20" y="44">Remove any one and it stops being an agent. Remove the loop and it is a very good search box.</text>
<rect class="fig-box" x="20" y="86" width="210" height="50" rx="12"/><text class="fig-box-title" x="34" y="108">A goal, and its sub-goals</text><text class="fig-box-sub" x="34" y="125">not an instruction to follow</text>
<path class="fig-exit-path" d="M230 111 L292 168" fill="none"/>
<rect class="fig-box" x="20" y="148" width="210" height="50" rx="12"/><text class="fig-box-title" x="34" y="170">Plain language in and out</text><text class="fig-box-sub" x="34" y="187">no query syntax to learn</text>
<path class="fig-exit-path" d="M230 173 L292 168" fill="none"/>
<rect class="fig-box" x="20" y="210" width="210" height="50" rx="12"/><text class="fig-box-title" x="34" y="232">Memory</text><text class="fig-box-sub" x="34" y="249">what it did, and how that went</text>
<path class="fig-exit-path" d="M230 235 L292 168" fill="none"/>
<rect class="fig-box" x="530" y="86" width="210" height="50" rx="12"/><text class="fig-box-title" x="544" y="108">Tools</text><text class="fig-box-sub" x="544" y="125">the graph, series, events, files</text>
<path class="fig-exit-path" d="M468 168 L530 111" fill="none"/>
<rect class="fig-box" x="530" y="148" width="210" height="50" rx="12"/><text class="fig-box-title" x="544" y="170">A planner</text><text class="fig-box-sub" x="544" y="187">picks the next step, not the plan</text>
<path class="fig-exit-path" d="M468 168 L530 173" fill="none"/>
<rect class="fig-box" x="530" y="210" width="210" height="50" rx="12"/><text class="fig-box-title" x="544" y="232">Judgement</text><text class="fig-box-sub" x="544" y="249">was that step any good?</text>
<path class="fig-exit-path" d="M468 168 L530 235" fill="none"/>
<rect class="fig-lit-box c-blue" x="292" y="130" width="176" height="76" rx="16"/><text class="fig-lit-title" x="380" y="164" text-anchor="middle">The agent</text><text class="fig-lit-sub" x="380" y="182" text-anchor="middle">decides what to do next</text>
<path class="fig-loop-arc" d="M464.3 127.3 A 9 9 0 1 1 470.7 133.7"/><path class="fig-loop-head" d="M465.4 132.3 L471.7 137.7 L473.5 130.7 z"/>
<text class="fig-sub" x="20" y="290">A chatbot has the language interface and nothing else. What an agent adds is the right-hand</text>
<text class="fig-sub" x="20" y="308">column: it can act, decide the next move, and tell whether the last one helped.</text>
</svg>