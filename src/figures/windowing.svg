<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" class="fig-windowing" role="img" aria-label="Three sensor streams as horizontal lanes of events. Vertical slices divide time into four equal tumbling windows; every event falls in exactly one window. A bracket marks the window size and an arrow marks time.">
<text class="fig-title" x="20" y="24">Tumbling windows: every event lands in exactly one slice</text>
<text class="fig-sub" x="20" y="44">Three sensors streaming, time cut into equal windows.</text><text class="fig-sub" x="20" y="60">When a window closes, its aggregate is emitted seconds later.</text>
