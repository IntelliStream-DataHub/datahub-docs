<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" class="fig-issuer-neighbourhood" role="img" aria-label="A results release arrives as an event on Issuer A. From there the graph reaches two suppliers held in the portfolio, a fund holding both, and a peer in the same end market, each of which carries its own price and fundamentals series.">
<text class="fig-title" x="20" y="24">One filing, and everything it is allowed to move</text>
<text class="fig-sub" x="20" y="44">The event lands on one issuer. What it means for the book is a question about relationships.</text>
