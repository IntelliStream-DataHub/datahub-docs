<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" class="fig-event-detection" role="img" aria-label="A continuous signal with four episodes: a spike past the alarm threshold, a sustained elevated plateau, a burst of abnormal oscillation, and a shift to a new operating level. Beneath the trace, each episode produces a typed event chip: alarm, stress, anomaly, new condition.">
<text class="fig-title" x="20" y="24">From a continuous signal to typed events</text>
<text class="fig-sub" x="20" y="44">The signal never says anything; it just varies.</text><text class="fig-sub" x="20" y="60">Detection functions decide when the variation means something.</text>
<line class="fig-track" x1="70" y1="112" x2="740" y2="112"/>
