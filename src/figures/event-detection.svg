<text class="fig-box-sub" x="20" y="330">The signal is continuous; what it means is discrete. Each detection lands as a typed event, anchored to the</text>
<text class="fig-box-sub" x="20" y="348">equipment it concerns, in the same event log as every alarm and work order, ready to overlay, query, or wake an agent.</text>
