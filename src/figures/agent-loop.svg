<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" class="fig-agent-loop" role="img" aria-label="An agent loop: observe, reason, act, check, and around again — with the knowledge graph at the centre supplying context at every step, and an exit to a sourced answer once the goal is met.">
<text class="fig-title" x="20" y="24">An agent loop</text>
<text class="fig-sub" x="20" y="44">One step at a time, checking its own work, until the goal is met or a limit stops it.</text>
<circle class="fig-track" cx="380" cy="290" r="196"/>
<rect class="fig-centre" x="285" y="260" width="190" height="60" rx="14"/>
<text class="fig-centre-title" x="380" y="284" text-anchor="middle">Your knowledge graph</text>
<text class="fig-centre-sub" x="380" y="304" text-anchor="middle">context at every step</text>
<g class="fig-unlit s0"><rect class="fig-box" x="294" y="66" width="172" height="56" rx="14"/><text class="fig-box-title" x="380" y="86" text-anchor="middle">Observe</text><text class="fig-box-sub" x="380" y="103" text-anchor="middle">read the graph,</text><text class="fig-box-sub" x="380" y="116" text-anchor="middle">signals and events</text></g>
<g class="fig-lit s0"><rect class="fig-lit-box c-blue" x="294" y="66" width="172" height="56" rx="14"/><text class="fig-lit-title" x="380" y="86" text-anchor="middle">Observe</text><text class="fig-lit-sub" x="380" y="103" text-anchor="middle">read the graph,</text><text class="fig-lit-sub" x="380" y="116" text-anchor="middle">signals and events</text></g>
<g class="fig-unlit s25"><rect class="fig-box" x="490" y="262" width="172" height="56" rx="14"/><text class="fig-box-title" x="576" y="282" text-anchor="middle">Reason</text><text class="fig-box-sub" x="576" y="299" text-anchor="middle">decide the single</text><text class="fig-box-sub" x="576" y="312" text-anchor="middle">next step</text></g>
<g class="fig-lit s25"><rect class="fig-lit-box c-blue" x="490" y="262" width="172" height="56" rx="14"/><text class="fig-lit-title" x="576" y="282" text-anchor="middle">Reason</text><text class="fig-lit-sub" x="576" y="299" text-anchor="middle">decide the single</text><text class="fig-lit-sub" x="576" y="312" text-anchor="middle">next step</text></g>
<g class="fig-unlit s50"><rect class="fig-box" x="294" y="458" width="172" height="56" rx="14"/><text class="fig-box-title" x="380" y="478" text-anchor="middle">Act</text><text class="fig-box-sub" x="380" y="495" text-anchor="middle">traverse, analyse,</text><text class="fig-box-sub" x="380" y="508" text-anchor="middle">or draft an action</text></g>
<g class="fig-lit s50"><rect class="fig-lit-box c-orange" x="294" y="458" width="172" height="56" rx="14"/><text class="fig-lit-title" x="380" y="478" text-anchor="middle">Act</text><text class="fig-lit-sub" x="380" y="495" text-anchor="middle">traverse, analyse,</text><text class="fig-lit-sub" x="380" y="508" text-anchor="middle">or draft an action</text></g>
<g class="fig-unlit s75"><rect class="fig-box" x="98" y="262" width="172" height="56" rx="14"/><text class="fig-box-title" x="184" y="282" text-anchor="middle">Check</text><text class="fig-box-sub" x="184" y="299" text-anchor="middle">did that answer it?</text><text class="fig-box-sub" x="184" y="312" text-anchor="middle">if not, go again</text></g>
<g class="fig-lit s75"><rect class="fig-lit-box c-green" x="98" y="262" width="172" height="56" rx="14"/><text class="fig-lit-title" x="184" y="282" text-anchor="middle">Check</text><text class="fig-lit-sub" x="184" y="299" text-anchor="middle">did that answer it?</text><text class="fig-lit-sub" x="184" y="312" text-anchor="middle">if not, go again</text></g>
<g class="fig-orbit"><circle class="fig-token" cx="380" cy="94" r="9"/></g>
<path class="fig-exit-path" d="M184 318 Q 150 400 128 448"/><rect class="fig-exit-box" x="24" y="450" width="190" height="62" rx="14"/><text class="fig-exit-title" x="119" y="474" text-anchor="middle">Sourced answer</text><text class="fig-exit-sub" x="119" y="492" text-anchor="middle">or a drafted action</text><text class="fig-exit-note" x="119" y="530" text-anchor="middle">only when the goal is met</text>
</svg>