<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" class="fig-function-branching" role="img" aria-label="A pipeline forking like a git branch: tank level and air temperature feed both the production cleaning function v1 and its cloned, modified copy v2. Each writes its own corrected series, and both outputs feed a comparison against lab measurements, which decides promotion.">
<text class="fig-title" x="20" y="24">Branching a pipeline, like branching code</text>
<text class="fig-sub" x="20" y="44">Clone the cleaning function, improve the algorithm in the copy, and race both against the same inputs.</text>
<rect class="fig-lit-box c-green" x="20" y="99" width="190" height="42" rx="12"/><text class="fig-lit-sub" x="115" y="124" text-anchor="middle">21-LT-4012 · tank level</text>
<rect class="fig-lit-box c-green" x="20" y="155" width="190" height="42" rx="12"/><text class="fig-lit-sub" x="115" y="180" text-anchor="middle">21-TT-4013 · air temp</text>
<path class="fig-exit-path fig-flow" d="M210 120 L260 110" fill="none"/>
<path class="fig-centre" d="M260 105 L270 110 L260 115 z"/>
<path class="fig-exit-path fig-flow" d="M210 176 L260 122" fill="none"/>
<path class="fig-centre" d="M260 117 L270 122 L260 127 z"/>
