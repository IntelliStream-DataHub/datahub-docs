<rect class="fig-box" x="270" y="204" width="180" height="56" rx="12"/><text class="fig-box-title" x="360" y="227" text-anchor="middle">Clean · v2</text><text class="fig-box-sub" x="360" y="245" text-anchor="middle">cloned, new algorithm</text>
<path class="fig-exit-path fig-flow" d="M450 116 L500 116" fill="none"/>
<path class="fig-centre" d="M500 111 L510 116 L500 121 z"/>
<path class="fig-exit-path fig-flow" d="M450 232 L500 232" fill="none"/>
