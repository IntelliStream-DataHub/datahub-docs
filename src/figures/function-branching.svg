<rect class="fig-box" x="510" y="204" width="180" height="56" rx="12"/><text class="fig-box-title" x="600" y="227" text-anchor="middle">level · corrected v2</text><text class="fig-box-sub" x="600" y="245" text-anchor="middle">the challenger</text>
<line class="fig-track" x1="690" y1="116" x2="724" y2="116"/>
<line class="fig-track" x1="690" y1="232" x2="724" y2="232"/>
<line class="fig-track" x1="724" y1="116" x2="724" y2="318"/>
<line class="fig-track" x1="724" y1="318" x2="694" y2="318"/>
<path class="fig-centre" d="M694 313 L682 318 L694 323 z"/>
<rect class="fig-centre" x="502" y="290" width="180" height="56" rx="12"/><text class="fig-centre-title" x="592" y="313" text-anchor="middle">compare accuracy</text><text class="fig-centre-sub" x="592" y="331" text-anchor="middle">against the lab dips</text>
<text class="fig-box-sub" x="20" y="372">Both branches read the same inputs and write parallel series, so the race is fair and cheap to judge.</text>
<text class="fig-box-sub" x="20" y="390">Promote the winner. The loser and the comparison stay in the graph, so the pipeline improves without losing its history.</text>
