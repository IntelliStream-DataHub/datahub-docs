<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" class="fig-measured-generated" role="img" aria-label="Two lanes. In the first a sensor produces a reading which is stored as a datapoint. In the second a model of the same pump produces a reading of the same kind, stored the same way, and marked as generated.">
<text class="fig-title" x="20" y="24">The only difference is where the number came from</text>
<text class="fig-sub" x="20" y="44">A reading with a time on it is a datapoint. Both lanes end with one, and they look alike.</text>
<text class="fig-box-title" x="20" y="96">Measured</text>
<rect class="fig-box" x="20" y="104" width="186" height="52" rx="12"/><text class="fig-box-sub" x="113" y="134" text-anchor="middle">A sensor on the pump</text>
<path class="fig-exit-path fig-flow" d="M206 130 L235 130" fill="none"/>
<path class="fig-centre" d="M235 125 L246 130 L235 135 z"/>
<rect class="fig-box" x="252" y="104" width="150" height="52" rx="12"/><text class="fig-box-title" x="327" y="135" text-anchor="middle">71.2 °C at 09:14</text>
<path class="fig-exit-path fig-flow" d="M402 130 L431 130" fill="none"/>
<path class="fig-centre" d="M431 125 L442 130 L431 135 z"/>
<rect class="fig-box" x="448" y="104" width="292" height="52" rx="12"/><text class="fig-box-sub" x="594" y="134" text-anchor="middle">one datapoint, stored</text>
<text class="fig-box-title" x="20" y="188">Generated</text>
<rect class="fig-box" x="20" y="196" width="186" height="52" rx="12"/><text class="fig-box-sub" x="113" y="226" text-anchor="middle">A model of the pump</text>
<path class="fig-exit-path fig-flow" d="M206 222 L235 222" fill="none"/>
<path class="fig-centre" d="M235 217 L246 222 L235 227 z"/>
<rect class="fig-box" x="252" y="196" width="150" height="52" rx="12"/><text class="fig-box-title" x="327" y="227" text-anchor="middle">71.4 °C at 09:14</text>
<path class="fig-exit-path fig-flow" d="M402 222 L431 222" fill="none"/>
<path class="fig-centre" d="M431 217 L442 222 L431 227 z"/>
<rect class="fig-lit-box c-orange" x="448" y="196" width="292" height="52" rx="12"/><text class="fig-lit-sub" x="594" y="226" text-anchor="middle">one datapoint, stored, marked generated</text>
<text class="fig-sub" x="20" y="286">Nothing in the number itself says which lane it came from. The mark on the second one is the</text>
<text class="fig-sub" x="20" y="304">only thing keeping the two apart, which is why it is not optional.</text>
</svg>