<rect class="fig-box" x="436" y="274" width="270" height="48" rx="12"/><text class="fig-box-title" x="571" y="295" text-anchor="middle">50-hour inspection</text><text class="fig-box-sub" x="571" y="312" text-anchor="middle">could be pulled forward</text>
