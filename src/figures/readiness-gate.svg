<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" class="fig-readiness-gate" role="img" aria-label="A squadron of fourteen airframes, eleven available and three gated. Below, the three gated tails connect to what is holding them: two of them to the same hydraulic part with a nine day lead time, and one to a scheduled inspection.">
<text class="fig-title" x="20" y="24">Readiness is a rollup, and the answer is which nodes gate it</text>
<text class="fig-sub" x="20" y="44">Fourteen airframes is a number anyone can produce. Which three, and why, is a traversal.</text>
