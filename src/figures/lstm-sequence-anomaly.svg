<text class="fig-box-sub" x="608" y="256" text-anchor="middle">the surprise, and it is growing</text>
<text class="fig-sub" x="20" y="316">Every reading is in range, so no threshold fires and no snapshot model has anything to say.</text>
<text class="fig-sub" x="20" y="334">What changed is the pattern, and a pattern only exists across time.</text>
</svg>