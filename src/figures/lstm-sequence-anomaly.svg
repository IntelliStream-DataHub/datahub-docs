<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" class="fig-lstm-anomaly" role="img" aria-label="A signal cycling regularly between a high and a low limit. Two thirds of the way along, the actual trace stops matching the prediction: the cycle flattens and drifts. Every value stays inside the limits, so no threshold fires, but the shape has changed and that is what a sequence model detects.">
<text class="fig-title" x="20" y="24">An anomaly that never crosses a limit</text>
<text class="fig-sub" x="20" y="44">A sequence model predicts what should come next. The gap between that and what arrives is the finding.</text>
<line class="fig-track" x1="120" y1="112" x2="730" y2="112"/>
<line class="fig-track" x1="120" y1="268" x2="730" y2="268"/>
<text class="fig-box-sub" x="120" y="104">high limit, never reached</text>
<text class="fig-box-sub" x="120" y="286">low limit, never reached</text>
<line class="fig-track" x1="470" y1="96" x2="470" y2="272"/>
<text class="fig-box-sub" x="478" y="96">the shape changes here</text>
