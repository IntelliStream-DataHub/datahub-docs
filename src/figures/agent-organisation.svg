<path class="fig-exit-path fig-flow" d="M527 236 C 527 250, 441 250, 441 264" fill="none"/>
<path class="fig-exit-path fig-flow" d="M527 236 C 527 250, 613 250, 613 264" fill="none"/>
<path class="fig-exit-path fig-flow" d="M710 368 L730 368 L730 124 L490 124" fill="none"/>
<text class="fig-box-sub" x="610" y="116" text-anchor="middle">results flow back up</text>
