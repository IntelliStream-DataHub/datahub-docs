<rect class="fig-box" x="20" y="96" width="150" height="56" rx="12"/><text class="fig-box-title" x="95" y="120" text-anchor="middle">Leadership</text><text class="fig-box-sub" x="95" y="138" text-anchor="middle">sets the goals</text><rect class="fig-centre" x="270" y="96" width="220" height="56" rx="14"/><text class="fig-centre-title" x="380" y="120" text-anchor="middle">Coordinator agent</text><text class="fig-centre-sub" x="380" y="138" text-anchor="middle">divides goals, sets incentives</text>
