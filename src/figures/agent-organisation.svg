<rect class="fig-badge" x="204" y="171" width="58" height="18" rx="9"/><line class="fig-badge-line" x1="215" y1="176" x2="215" y2="173.5"/><circle class="fig-badge-dot" cx="215" cy="173.2" r="1.1"/><rect class="fig-badge-line" x="210" y="176" width="10" height="8.5" rx="2"/><circle class="fig-badge-dot" cx="213" cy="180.4" r="1.2"/><circle class="fig-badge-dot" cx="217" cy="180.4" r="1.2"/><text class="fig-badge-text" x="225" y="184">agent</text>
