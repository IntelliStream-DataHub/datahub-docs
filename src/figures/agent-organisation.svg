<rect class="fig-badge" x="374" y="255" width="58" height="18" rx="9"/><line class="fig-badge-line" x1="385" y1="260" x2="385" y2="257.5"/><circle class="fig-badge-dot" cx="385" cy="257.2" r="1.1"/><rect class="fig-badge-line" x="380" y="260" width="10" height="8.5" rx="2"/><circle class="fig-badge-dot" cx="383" cy="264.4" r="1.2"/><circle class="fig-badge-dot" cx="387" cy="264.4" r="1.2"/><text class="fig-badge-text" x="395" y="268">agent</text>
<rect class="fig-lit-box c-green" x="536" y="264" width="155" height="56" rx="12"/><text class="fig-lit-title" x="613" y="288" text-anchor="middle">Data quality</text><text class="fig-lit-sub" x="613" y="306" text-anchor="middle">spots drift and gaps</text>
<rect class="fig-badge" x="546" y="255" width="58" height="18" rx="9"/><line class="fig-badge-line" x1="557" y1="260" x2="557" y2="257.5"/><circle class="fig-badge-dot" cx="557" cy="257.2" r="1.1"/><rect class="fig-badge-line" x="552" y="260" width="10" height="8.5" rx="2"/><circle class="fig-badge-dot" cx="555" cy="264.4" r="1.2"/><circle class="fig-badge-dot" cx="559" cy="264.4" r="1.2"/><text class="fig-badge-text" x="567" y="268">agent</text>
<rect class="fig-lit-box c-orange" x="20" y="344" width="690" height="48" rx="12"/><text class="fig-lit-title" x="365" y="364" text-anchor="middle">The knowledge graph</text><text class="fig-lit-sub" x="365" y="381" text-anchor="middle">the shared context, and the shared workplace, for every agent</text>
