<rect class="fig-lit-box c-blue" x="22" y="180" width="150" height="56" rx="12"/><text class="fig-lit-title" x="97" y="204" text-anchor="middle">Operations</text><text class="fig-lit-sub" x="97" y="222" text-anchor="middle">keeps the work moving</text>
<rect class="fig-badge" x="32" y="171" width="58" height="18" rx="9"/><line class="fig-badge-line" x1="43" y1="176" x2="43" y2="173.5"/><circle class="fig-badge-dot" cx="43" cy="173.2" r="1.1"/><rect class="fig-badge-line" x="38" y="176" width="10" height="8.5" rx="2"/><circle class="fig-badge-dot" cx="41" cy="180.4" r="1.2"/><circle class="fig-badge-dot" cx="45" cy="180.4" r="1.2"/><text class="fig-badge-text" x="53" y="184">agent</text>
