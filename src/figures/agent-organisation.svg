<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" class="fig-agent-organisation" role="img" aria-label="An organisation chart of AI agents. Leadership sets the goals for a coordinator agent, which divides them among three manager agents for operations, reporting and integrity. Under them, worker agents run integrations, draft reports, flag faults and watch data quality. Work flows down the chart, results flow back up a return path, and all of the agents stand on one shared bar: the knowledge graph, the context and workplace they have in common. Every agent node carries a small robot badge reading agent; the leadership box carries none, because leadership is human.">
<text class="fig-title" x="20" y="24">An organisation of agents</text>
<text class="fig-sub" x="20" y="44">The same shape as a human organisation, because it solves the same problem: many hands, one goal.</text>
<path class="fig-exit-path fig-flow" d="M380 152 C 380 168, 97 164, 97 180" fill="none"/>
<path class="fig-exit-path fig-flow" d="M380 152 C 380 168, 269 164, 269 180" fill="none"/>
<path class="fig-exit-path fig-flow" d="M380 152 C 380 168, 527 164, 527 180" fill="none"/>
<path class="fig-exit-path fig-flow" d="M97 236 C 97 250, 97 250, 97 264" fill="none"/>
