<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" class="fig-k-means" role="img" aria-label="Two panels. On the left, three cross-shaped centres start at arbitrary positions and are joined by dashed lines to where they settle, in the middle of three groups of points. On the right, the same three groups carry the names a person gave them, and one point sits far from every centre.">
<text class="fig-title" x="20" y="24">k-means: the whole method, and what it leaves you</text>
<text class="fig-sub" x="20" y="44">You choose how many groups. Everything after that is repetition until nothing moves.</text>
<text class="fig-box-title" x="20" y="78">How it works</text>
<text class="fig-box-sub" x="20" y="96">the centres move to where the points are</text>
<text class="fig-box-title" x="400" y="78">What you get</text>
<text class="fig-box-sub" x="400" y="96">three groups, named afterwards by somebody who knows the plant</text>
