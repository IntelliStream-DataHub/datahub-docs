<text class="fig-box-sub" x="142" y="148">where they started</text>
<text class="fig-box-sub" x="20" y="270">1 · drop k centres anywhere; k is your choice</text>
<text class="fig-box-sub" x="20" y="286">2 · every point joins the centre nearest to it</text>
<text class="fig-box-sub" x="20" y="302">3 · each centre moves to the middle of its points</text>
<text class="fig-box-sub" x="20" y="318">then repeat 2 and 3 until nothing moves</text>
