<text class="fig-box-sub" x="422" y="298">filed under its nearest group, and nowhere near it</text>
<text class="fig-sub" x="20" y="344">k-means finds the groups and nothing else. Naming them is human work, and the name is worth keeping as a</text>
<text class="fig-sub" x="20" y="362">label, because from then on the distance to the nearest centre is an anomaly score you got for free.</text>
</svg>