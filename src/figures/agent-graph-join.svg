<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" class="fig-agent-graph-join" role="img" aria-label="Three time series on the left and three events on the right, with a small graph in the middle: a compressor, its lube system and the export line it feeds. Every series and every event connects to the node it belongs to, so the vibration trace, the high-vibration alarm and the lube work order meet on the same machine.">
