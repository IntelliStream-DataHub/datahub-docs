<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" class="fig-robot-learning" role="img" aria-label="Four stages in a loop: a person demonstrates the task, the robot copies the demonstrations, the robot practises millions of times in simulation, and then it works for real and records everything. The practice stage is highlighted because almost all of the data comes from there, and it is generated.">
<text class="fig-title" x="20" y="24">Where a robot’s training data comes from</text>
<text class="fig-sub" x="20" y="44">A person can demonstrate a task a few hundred times. Learning it takes millions of attempts.</text>
<rect class="fig-box" x="20" y="104" width="158" height="72" rx="12"/><text class="fig-box-title" x="99" y="134" text-anchor="middle">A person shows it</text><text class="fig-box-sub" x="99" y="154" text-anchor="middle">a few hundred demonstrations</text>
<path class="fig-exit-path fig-flow" d="M178 140 L195 140" fill="none"/>
<path class="fig-centre" d="M195 135.0 L206 140.0 L195 145.0 z"/>
<rect class="fig-box" x="206" y="104" width="168" height="72" rx="12"/><text class="fig-box-title" x="290" y="134" text-anchor="middle">It copies</text><text class="fig-box-sub" x="290" y="154" text-anchor="middle">imitation learning</text>
<path class="fig-exit-path fig-flow" d="M374 140 L391 140" fill="none"/>
<path class="fig-centre" d="M391 135.0 L402 140.0 L391 145.0 z"/>
<rect class="fig-lit-box c-orange" x="402" y="104" width="158" height="72" rx="12"/><text class="fig-lit-title" x="481" y="134" text-anchor="middle">It practises</text><text class="fig-lit-sub" x="481" y="154" text-anchor="middle">millions of tries, in simulation</text>
<path class="fig-exit-path fig-flow" d="M560 140 L577 140" fill="none"/>
<path class="fig-centre" d="M577 135.0 L588 140.0 L577 145.0 z"/>
<rect class="fig-box" x="588" y="104" width="152" height="72" rx="12"/><text class="fig-box-title" x="664" y="134" text-anchor="middle">It works</text><text class="fig-box-sub" x="664" y="154" text-anchor="middle">and records everything</text>
<path class="fig-exit-path fig-flow" d="M664 176 L664 214 L99 214 L99 187" fill="none"/>
<path class="fig-centre" d="M94 187 L99 176 L104 187 z"/>
<text class="fig-box-sub" x="380" y="234" text-anchor="middle">what it learns in the world becomes the next round of demonstrations</text>
<text class="fig-sub" x="20" y="268">Nearly all of the training data comes from the highlighted stage, and none of it was measured.</text>
<text class="fig-sub" x="20" y="286">The real robot is where the result is tested, not where the practice happens.</text>
</svg>