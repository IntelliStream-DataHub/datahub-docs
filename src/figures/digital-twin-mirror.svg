<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" class="fig-digital-twin-mirror" role="img" aria-label="Three physical things, a pump, a sensor and a maintenance crew, each mirrored by a digital counterpart: a resource in the knowledge graph, a time series and an event. Live data flows left to right keeping the twin in sync, and a return path along the bottom carries decisions and actions back to the operation, closing the loop.">
<text class="fig-title" x="20" y="24">One operation, mirrored</text>
<text class="fig-sub" x="20" y="44">Each physical thing has one digital counterpart, and live data keeps the mirror honest.</text>
<text class="fig-box-sub" x="148" y="68" text-anchor="middle">The physical operation</text>
<text class="fig-box-sub" x="616" y="68" text-anchor="middle">The digital twin</text>
<path class="fig-exit-path fig-flow" d="M268 114 L492 114" fill="none"/>
<path class="fig-exit-path fig-flow" d="M268 194 L492 194" fill="none"/>
<path class="fig-exit-path fig-flow" d="M268 274 L492 274" fill="none"/>
<path class="fig-exit-path fig-flow" d="M616 302 L616 330 L148 330 L148 298" fill="none"/>
<rect class="fig-box" x="28" y="90" width="240" height="48" rx="12"/><text class="fig-box-title" x="148" y="110" text-anchor="middle">Pump P-101</text><text class="fig-box-sub" x="148" y="128" text-anchor="middle">the machine itself</text><rect class="fig-lit-box c-blue" x="492" y="86" width="248" height="56" rx="12"/><text class="fig-lit-title" x="616" y="109" text-anchor="middle">Resource P-101</text><text class="fig-lit-sub" x="616" y="127" text-anchor="middle">in the knowledge graph</text>
<rect class="fig-box" x="28" y="170" width="240" height="48" rx="12"/><text class="fig-box-title" x="148" y="190" text-anchor="middle">Sensor 21-PT-1034</text><text class="fig-box-sub" x="148" y="208" text-anchor="middle">measuring inlet pressure</text><rect class="fig-lit-box c-green" x="492" y="166" width="248" height="56" rx="12"/><text class="fig-lit-title" x="616" y="189" text-anchor="middle">Time series</text><text class="fig-lit-sub" x="616" y="207" text-anchor="middle">datapoints, seconds behind reality</text>
<rect class="fig-box" x="28" y="250" width="240" height="48" rx="12"/><text class="fig-box-title" x="148" y="270" text-anchor="middle">Maintenance crew</text><text class="fig-box-sub" x="148" y="288" text-anchor="middle">opening a work order</text><rect class="fig-lit-box c-orange" x="492" y="246" width="248" height="56" rx="12"/><text class="fig-lit-title" x="616" y="269" text-anchor="middle">Event</text><text class="fig-lit-sub" x="616" y="287" text-anchor="middle">the work order, in the log</text>
<text class="fig-box-sub" x="382" y="348" text-anchor="middle">decisions and actions flow back, closing the loop</text>
</svg>