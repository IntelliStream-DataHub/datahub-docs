<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" class="fig-board-gates" role="img" aria-label="Four board decision points: day zero approval, a ninety day continue decision, a six month test of whether the second question cost less than the first, and a twelve month recurring return.">
<text class="fig-title" x="20" y="24">What the board sees, and when</text>
<text class="fig-sub" x="20" y="44">Four pre-agreed tests. Each one produces evidence rather than a status update.</text>
<line class="fig-track" x1="10" y1="92" x2="750" y2="92"/>
<circle class="fig-token" cx="95" cy="92" r="7"/>
<rect class="fig-lit-box c-blue" x="10" y="118" width="170" height="132" rx="12"/><text class="fig-lit-sub" x="95" y="142" text-anchor="middle">Day 0</text><text class="fig-lit-title" x="95" y="166" text-anchor="middle">Approve</text><text class="fig-lit-sub" x="95" y="192" text-anchor="middle">One question named,</text><text class="fig-lit-sub" x="95" y="208" text-anchor="middle">an owner named,</text><text class="fig-lit-sub" x="95" y="224" text-anchor="middle">baseline recorded</text>
<circle class="fig-token" cx="285" cy="92" r="7"/>
<rect class="fig-lit-box c-orange" x="200" y="118" width="170" height="132" rx="12"/><text class="fig-lit-sub" x="285" y="142" text-anchor="middle">90 days</text><text class="fig-lit-title" x="285" y="166" text-anchor="middle">Continue?</text><text class="fig-lit-sub" x="285" y="192" text-anchor="middle">The question answered,</text><text class="fig-lit-sub" x="285" y="208" text-anchor="middle">and how, in writing.</text><text class="fig-lit-sub" x="285" y="224" text-anchor="middle">Compared to baseline</text>
<circle class="fig-token" cx="475" cy="92" r="7"/>
<rect class="fig-box" x="390" y="118" width="170" height="132" rx="12"/><text class="fig-box-sub" x="475" y="142" text-anchor="middle">6 months</text><text class="fig-box-title" x="475" y="166" text-anchor="middle">Compounding</text><text class="fig-box-sub" x="475" y="192" text-anchor="middle">Second question costs</text><text class="fig-box-sub" x="475" y="208" text-anchor="middle">less than the first,</text><text class="fig-box-sub" x="475" y="224" text-anchor="middle">or we find out why</text>
<circle class="fig-token" cx="665" cy="92" r="7"/>
<rect class="fig-box" x="580" y="118" width="170" height="132" rx="12"/><text class="fig-box-sub" x="665" y="142" text-anchor="middle">12 months</text><text class="fig-box-title" x="665" y="166" text-anchor="middle">Return</text><text class="fig-box-sub" x="665" y="192" text-anchor="middle">Recurring hours saved,</text><text class="fig-box-sub" x="665" y="208" text-anchor="middle">per cycle and per</text><text class="fig-box-sub" x="665" y="224" text-anchor="middle">incident</text>
<text class="fig-box-sub" x="20" y="278">If the evidence is not there at a gate, stopping is the correct outcome, and it is cheap.</text>
</svg>