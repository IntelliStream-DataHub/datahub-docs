  <text class="fig-lit-sub" x="208" y="179" text-anchor="middle">Line 3</text>
  <rect class="fig-lit-box c-blue" x="447" y="138" width="210" height="58" rx="14"/>
  <text class="fig-lit-title" x="552" y="162" text-anchor="middle">Resource</text>
  <text class="fig-lit-sub" x="552" y="179" text-anchor="middle">Pump P-101</text>
</g>

