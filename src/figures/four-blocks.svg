<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" class="fig-four-blocks" role="img" aria-label="How the four building blocks fit together. A data set container — one domain, one permission boundary — holds everything. Inside it, two resources, Line 3 and Pump P-101, are joined by a named relationship: Line 3 contains Pump P-101. Each resource emits a time series, measured continuously, and an event, raised at a single moment. Line 3 emits the time series Line throughput and the event Shift changeover; Pump P-101 emits the time series Discharge pressure and the event High-vibration alarm.">
<text class="fig-title" x="20" y="24">The four building blocks</text>
<text class="fig-sub" x="20" y="44">One data set holds it all — resources connect, and each emits time series and events.</text>

<g>
  <rect class="fig-track" x="28" y="60" width="704" height="274" rx="18"/>
  <rect class="fig-centre" x="44" y="76" width="290" height="46" rx="12"/>
  <text class="fig-centre-title" x="60" y="94">Data set</text>
  <text class="fig-centre-sub" x="60" y="111">one domain, one permission boundary</text>
</g>

<g>
  <rect class="fig-lit-box c-blue" x="103" y="138" width="210" height="58" rx="14"/>
