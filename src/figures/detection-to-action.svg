<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" class="fig-detection-action" role="img" aria-label="A chain in the graph: line pressure, line temperature and pigging events feed a hydrate risk watch function, which writes a hydrate risk event. The event wakes an inhibitor planner agent, which drafts a dose and a pigging run for control-room approval.">
<text class="fig-title" x="20" y="24">From detection to action, every hop in the graph</text>
<text class="fig-sub" x="20" y="44">A function detects, the event wakes an agent, and the agent drafts. A person still approves.</text>
<rect class="fig-lit-box c-green" x="20" y="76" width="180" height="40" rx="12"/><text class="fig-lit-sub" x="110" y="100" text-anchor="middle">21-PT-3105 · pressure</text>
<path class="fig-exit-path fig-flow" d="M200 96 L250 132" fill="none"/>
<path class="fig-centre" d="M250 127 L260 132 L250 137 z"/>
<rect class="fig-lit-box c-green" x="20" y="128" width="180" height="40" rx="12"/><text class="fig-lit-sub" x="110" y="152" text-anchor="middle">21-TT-3106 · line temp</text>
<path class="fig-exit-path fig-flow" d="M200 148 L250 148" fill="none"/>
<path class="fig-centre" d="M250 143 L260 148 L250 153 z"/>
<rect class="fig-lit-box c-orange" x="20" y="180" width="180" height="40" rx="12"/><text class="fig-lit-sub" x="110" y="204" text-anchor="middle">Pigging events</text>
<path class="fig-exit-path fig-flow" d="M200 200 L250 164" fill="none"/>
<path class="fig-centre" d="M250 159 L260 164 L250 169 z"/>
<text class="fig-box-sub" x="225" y="100" text-anchor="middle">reads</text>
<rect class="fig-lit-box c-blue" x="260" y="118" width="160" height="60" rx="12"/><text class="fig-lit-title" x="340" y="142" text-anchor="middle">Function</text><text class="fig-lit-sub" x="340" y="160" text-anchor="middle">hydrate risk watch</text>
<path class="fig-exit-path fig-flow" d="M420 148 L548 148" fill="none"/>
<path class="fig-centre" d="M548 143 L560 148 L548 153 z"/>
<text class="fig-box-sub" x="485" y="140" text-anchor="middle">writes</text>
<rect class="fig-lit-box c-orange" x="560" y="120" width="180" height="56" rx="12"/><text class="fig-lit-title" x="650" y="143" text-anchor="middle">Events</text><text class="fig-lit-sub" x="650" y="161" text-anchor="middle">hydrate risk</text>
<path class="fig-exit-path fig-flow" d="M650 176 L650 232" fill="none"/>
<path class="fig-centre" d="M645 232 L650 244 L655 232 z"/>
<text class="fig-box-sub" x="662" y="210">wakes</text>
<rect class="fig-lit-box c-blue" x="560" y="244" width="180" height="56" rx="28"/><text class="fig-lit-title" x="650" y="267" text-anchor="middle">Agent</text><text class="fig-lit-sub" x="650" y="285" text-anchor="middle">inhibitor planner</text>
<path class="fig-exit-path fig-flow" d="M560 272 L522 272" fill="none"/>
<path class="fig-centre" d="M522 267 L510 272 L522 277 z"/>
<text class="fig-box-sub" x="541" y="264" text-anchor="middle">acts</text>
<rect class="fig-centre" x="250" y="244" width="260" height="56" rx="12"/><text class="fig-centre-title" x="380" y="268" text-anchor="middle">drafts dose + pigging run</text><text class="fig-centre-sub" x="380" y="286" text-anchor="middle">for control-room approval</text>
<text class="fig-box-sub" x="20" y="344">The agent bypasses no one: it drafts, and the control room approves. And because every hop is a node or an event,</text>
<text class="fig-box-sub" x="20" y="362">the whole chain from raw signal to action is traceable afterwards, which is what makes autonomy auditable.</text>
</svg>