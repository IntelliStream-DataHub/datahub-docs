<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" class="fig-resource-anatomy" role="img" aria-label="A resource card with three fields: the name, which is the rdfs:label and changes freely; the label PressureTransmitter, which is the rdf:type; and the external id 21-PT-1234, which is the IRI part that never changes. Below, a monitors relationship connects it to the separator V-201, annotated as the predicate that makes the model a graph.">
<text class="fig-title" x="20" y="24">One entry, three promises</text>
<text class="fig-sub" x="20" y="44">The resource form's three fields, and the standard role each one plays.</text>
<rect class="fig-centre" x="36" y="70" width="340" height="190" rx="14"/>
<text class="fig-centre-title" x="206" y="98" text-anchor="middle">A resource in the ontology</text>
<text class="fig-centre-sub" x="56" y="124">Name, changes freely</text><text class="fig-box-title" x="56" y="142">21-PT-1234 Separator inlet pressure</text><line class="fig-track" x1="376" y1="134" x2="470" y2="134"/><rect class="fig-box" x="470" y="115" width="270" height="38" rx="10"/><text class="fig-box-title" x="486" y="131">rdfs:label</text><text class="fig-box-sub" x="486" y="146">for people; rename freely</text>
<text class="fig-centre-sub" x="56" y="168">Label, the kind of thing</text><text class="fig-box-title" x="56" y="186">PressureTransmitter</text><line class="fig-track" x1="376" y1="178" x2="470" y2="178"/><rect class="fig-box" x="470" y="159" width="270" height="38" rx="10"/><text class="fig-box-title" x="486" y="175">rdf:type</text><text class="fig-box-sub" x="486" y="190">for querying whole kinds at once</text>
<text class="fig-centre-sub" x="56" y="212">External id, never changes</text><text class="fig-box-title" x="56" y="230">21-PT-1234</text><line class="fig-track" x1="376" y1="222" x2="470" y2="222"/><rect class="fig-box" x="470" y="203" width="270" height="38" rx="10"/><text class="fig-box-title" x="486" y="219">the IRI</text><text class="fig-box-sub" x="486" y="234">for systems; matched on, forever</text>
<path class="fig-track" d="M206 260 L206 278 L335 278 L335 296" fill="none"/><text class="fig-box-sub" x="225" y="273">monitors</text><rect class="fig-lit-box c-blue" x="240" y="296" width="190" height="48" rx="12"/><text class="fig-lit-title" x="335" y="316" text-anchor="middle">V-201</text><text class="fig-lit-sub" x="335" y="334" text-anchor="middle">the separator it monitors</text><line class="fig-track" x1="430" y1="320" x2="470" y2="320"/><rect class="fig-box" x="470" y="301" width="270" height="38" rx="10"/><text class="fig-box-title" x="486" y="317">the predicate</text><text class="fig-box-sub" x="486" y="332">relationships make it a graph</text>
<text class="fig-sub" x="20" y="372">The same three roles RDF defines, which is why your model is portable rather than proprietary.</text>
</svg>