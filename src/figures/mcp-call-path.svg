<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" class="fig-mcp-call-path" role="img" aria-label="A question travels from a person to an agent, which makes an MCP call carrying the user’s token. The call passes a gate that checks the token signature and issuer, the DataHub access role, the organization claim that selects the tenant, and the data set grants, before reaching the tools. The answer returns along the bottom with the ids and timestamps it used.">
<text class="fig-title" x="20" y="24">An MCP call is an ordinary authenticated request</text>
<text class="fig-sub" x="20" y="44">There is no agent door and no agent key. The same token, the same checks, in the same order.</text>
<text class="fig-box-sub" x="140" y="88" text-anchor="middle">a question</text>
<text class="fig-box-sub" x="333" y="88" text-anchor="end">MCP call, carrying your token</text>
<text class="fig-box-title" x="650" y="52" text-anchor="middle">37 tools</text>
<rect class="fig-box" x="20" y="96" width="100" height="52" rx="12"/><text class="fig-box-title" x="70" y="127" text-anchor="middle">You</text>
<path class="fig-exit-path fig-flow" d="M120 122 L149 122" fill="none"/>
<path class="fig-centre" d="M149 117.0 L160 122.0 L149 127.0 z"/>
<rect class="fig-lit-box c-blue" x="160" y="96" width="130" height="52" rx="12"/><text class="fig-lit-title" x="225" y="119" text-anchor="middle">Agent</text><text class="fig-lit-sub" x="225" y="136" text-anchor="middle">or assistant</text>
<path class="fig-exit-path fig-flow" d="M290 122 L333 122" fill="none"/>
<path class="fig-centre" d="M333 117.0 L344 122.0 L333 127.0 z"/>
<rect class="fig-centre" x="344" y="64" width="176" height="132" rx="12"/>
<text class="fig-centre-title" x="432" y="88" text-anchor="middle">Before any tool runs</text>
<g class="fig-seq fig-d1"><circle class="fig-dot-a" cx="360" cy="108" r="4"/><text class="fig-box-sub" x="372" y="112">signature and issuer</text></g>
<g class="fig-seq fig-d2"><circle class="fig-dot-a" cx="360" cy="129" r="4"/><text class="fig-box-sub" x="372" y="133">DATAHUB_ACCESS role</text></g>
<g class="fig-seq fig-d3"><circle class="fig-dot-a" cx="360" cy="150" r="4"/><text class="fig-box-sub" x="372" y="154">organization → tenant</text></g>
<g class="fig-seq fig-d4"><circle class="fig-dot-a" cx="360" cy="171" r="4"/><text class="fig-box-sub" x="372" y="175">data set grants</text></g>
<path class="fig-exit-path fig-flow" d="M520 122 L549 82" fill="none"/>
<path class="fig-centre" d="M549 77.0 L560 82.0 L549 87.0 z"/>
<path class="fig-exit-path fig-flow" d="M520 122 L549 128" fill="none"/>
<path class="fig-centre" d="M549 123.0 L560 128.0 L549 133.0 z"/>
<path class="fig-exit-path fig-flow" d="M520 122 L549 174" fill="none"/>
<path class="fig-centre" d="M549 169.0 L560 174.0 L549 179.0 z"/>
<rect class="fig-box" x="560" y="64" width="180" height="36" rx="10"/><text class="fig-box-sub" x="650" y="86" text-anchor="middle">resource_fetch_related</text>
<rect class="fig-box" x="560" y="110" width="180" height="36" rx="10"/><text class="fig-box-sub" x="650" y="132" text-anchor="middle">timeseries_fetch_datapoints</text>
<rect class="fig-box" x="560" y="156" width="180" height="36" rx="10"/><text class="fig-box-sub" x="650" y="178" text-anchor="middle">event_filter</text>
<path class="fig-exit-path fig-flow" d="M650 192 L650 236 L70 236 L70 159" fill="none"/>
<path class="fig-centre" d="M65 159 L70 148 L75 159 z"/>
<text class="fig-box-sub" x="360" y="256" text-anchor="middle">the answer, plus the ids, timestamps and values behind it</text>
<text class="fig-sub" x="20" y="288">A read-only agent is simply one holding a read-only token, which is why scoping an agent is</text>
<text class="fig-sub" x="20" y="306">the same administrative act as scoping any other service account, in the same place.</text>
</svg>