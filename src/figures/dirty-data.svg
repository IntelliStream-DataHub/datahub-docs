<rect class="fig-exit-box" x="20" y="228" width="720" height="62" rx="14"/><text class="fig-exit-title" x="40" y="252">Raw stays raw. A correction is a new series beside it, never an edit to the original.</text><text class="fig-exit-sub" x="40" y="274">And the correction is itself an event, so anyone can see what was changed, when, and on what grounds.</text>
</svg>