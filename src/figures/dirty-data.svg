<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" class="fig-dirty-data" role="img" aria-label="Five small charts showing the defects that turn up in industrial measurements: a frozen sensor, a spike, a slow drift, a gap, and a unit change that looks like a step. Below them, the rule: raw stays raw, a correction is a new series, and the correction itself is an event.">
<text class="fig-title" x="20" y="24">What dirty data actually looks like</text>
<text class="fig-sub" x="20" y="44">None of these announce themselves. Four of the five look like perfectly ordinary readings.</text>
<rect class="fig-box" x="20" y="104" width="140" height="60" rx="10"/>
<text class="fig-box-title" x="90" y="92" text-anchor="middle">Frozen</text>
<text class="fig-box-sub" x="90" y="184" text-anchor="middle">the sensor stopped,</text>
<text class="fig-box-sub" x="90" y="199" text-anchor="middle">the plant did not</text>
<rect class="fig-box" x="168" y="104" width="140" height="60" rx="10"/>
<text class="fig-box-title" x="238" y="92" text-anchor="middle">Spike</text>
<text class="fig-box-sub" x="238" y="184" text-anchor="middle">one impossible value,</text>
<text class="fig-box-sub" x="238" y="199" text-anchor="middle">and every average moves</text>
<rect class="fig-box" x="316" y="104" width="140" height="60" rx="10"/>
<text class="fig-box-title" x="386" y="92" text-anchor="middle">Drift</text>
<text class="fig-box-sub" x="386" y="184" text-anchor="middle">slowly wrong,</text>
<text class="fig-box-sub" x="386" y="199" text-anchor="middle">and nobody notices</text>
<rect class="fig-box" x="464" y="104" width="140" height="60" rx="10"/>
<text class="fig-box-title" x="534" y="92" text-anchor="middle">Gap</text>
<text class="fig-box-sub" x="534" y="184" text-anchor="middle">missing hours,</text>
<text class="fig-box-sub" x="534" y="199" text-anchor="middle">quietly filled in later</text>
<rect class="fig-box" x="612" y="104" width="140" height="60" rx="10"/>
<text class="fig-box-title" x="682" y="92" text-anchor="middle">Wrong unit</text>
<text class="fig-box-sub" x="682" y="184" text-anchor="middle">bar became psi:</text>
<text class="fig-box-sub" x="682" y="199" text-anchor="middle">a step, not a fault</text>
