<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" class="fig-experiment-rate" role="img" aria-label="Two rows comparing experiment throughput over one month. Without a shared model, three long trials each spend most of their time preparing data. With liberated data the preparation collapses and twelve experiments fit into the same month.">
<text class="fig-title" x="20" y="24">Innovation runs at the speed of its slowest experiment</text>
<text class="fig-sub" x="20" y="44">Same team, same month. The only difference is what one trial costs to start.</text>
<text class="fig-box-title" x="20" y="84">Without a shared model</text>
<line class="fig-track" x1="20" y1="152" x2="560" y2="152"/>
<rect class="fig-box" x="20" y="100" width="116" height="42" rx="10"/><text class="fig-box-sub" x="78" y="126" text-anchor="middle">preparing data</text><rect class="fig-lit-box c-blue" x="140" y="100" width="44" height="42" rx="10"/><text class="fig-lit-sub" x="162" y="126" text-anchor="middle">trial</text>
<rect class="fig-box" x="208" y="100" width="116" height="42" rx="10"/><text class="fig-box-sub" x="266" y="126" text-anchor="middle">preparing data</text><rect class="fig-lit-box c-blue" x="328" y="100" width="44" height="42" rx="10"/><text class="fig-lit-sub" x="350" y="126" text-anchor="middle">trial</text>
<rect class="fig-box" x="396" y="100" width="116" height="42" rx="10"/><text class="fig-box-sub" x="454" y="126" text-anchor="middle">preparing data</text><rect class="fig-lit-box c-blue" x="516" y="100" width="44" height="42" rx="10"/><text class="fig-lit-sub" x="538" y="126" text-anchor="middle">trial</text>
<text class="fig-box-sub" x="20" y="176">Each trial has to be worth funding before it starts</text>
<rect class="fig-box" x="580" y="92" width="160" height="58" rx="12"/><text class="fig-stat" x="660" y="122" text-anchor="middle">3</text><text class="fig-stat-label" x="660" y="136" text-anchor="middle">experiments</text><text class="fig-stat-label" x="660" y="147" text-anchor="middle">per month</text>
<text class="fig-box-title" x="20" y="228">With liberated data</text>
<line class="fig-track" x1="20" y1="296" x2="560" y2="296"/>
<rect class="fig-box" x="20" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="32" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="65" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="77" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="110" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="122" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="155" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="167" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="200" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="212" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="245" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="257" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="290" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="302" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="335" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="347" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="380" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="392" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="425" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="437" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="470" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="482" y="244" width="30" height="42" rx="8"/>
<rect class="fig-box" x="515" y="244" width="10" height="42" rx="4"/><rect class="fig-lit-box c-green" x="527" y="244" width="30" height="42" rx="8"/>
<text class="fig-box-sub" x="20" y="320">A trial no longer needs a business case, so more of them happen</text>
<rect class="fig-lit-box c-green" x="580" y="236" width="160" height="58" rx="12"/><text class="fig-stat fig-stat--on-fill" x="660" y="266" text-anchor="middle">12</text><text class="fig-stat-label--on-fill" x="660" y="280" text-anchor="middle">experiments</text><text class="fig-stat-label--on-fill" x="660" y="291" text-anchor="middle">per month</text>
<rect class="fig-box" x="20" y="344" width="14" height="14" rx="4"/><text class="fig-box-sub" x="42" y="355">preparing data</text><rect class="fig-lit-box c-green" x="150" y="344" width="14" height="14" rx="4"/><text class="fig-box-sub" x="172" y="355">actually experimenting</text>
</svg>