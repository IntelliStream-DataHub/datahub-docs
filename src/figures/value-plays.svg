<line class="fig-track" x1="120" y1="92" x2="120" y2="300"/>
<text class="fig-box-sub" x="110" y="100" text-anchor="end">more</text>
<text class="fig-box-sub" x="110" y="300" text-anchor="end">less</text>
<text class="fig-box-sub" x="54" y="196">effort</text>
<text class="fig-box-sub" x="405" y="330" text-anchor="middle">weeks, to quarters, to a year</text>
<circle class="fig-token" cx="177" cy="279" r="6"/>
<rect class="fig-lit-box c-blue" x="124" y="245" width="118" height="24" rx="10"/><text class="fig-lit-sub" x="183" y="261" text-anchor="middle">Data liberation</text>
