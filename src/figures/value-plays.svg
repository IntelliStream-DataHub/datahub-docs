<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" class="fig-value-plays" role="img" aria-label="Six value plays plotted by effort against time to value. Data liberation and faster investigations sit lowest on both axes. Audit-ready reporting and energy and emissions are marked as planned rather than available today.">
<text class="fig-title" x="20" y="24">Which play to start with</text>
<text class="fig-sub" x="20" y="44">Lower and further left is cheaper to reach. Start bottom-left and work outward.</text>
