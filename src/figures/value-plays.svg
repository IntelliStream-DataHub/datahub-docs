<rect class="fig-lit-box c-blue" x="156" y="204" width="156" height="24" rx="10"/><text class="fig-lit-sub" x="234" y="220" text-anchor="middle">Faster investigations</text>
<circle class="fig-token" cx="148" cy="196" r="6"/>
<rect class="fig-lit-box c-blue" x="124" y="162" width="124" height="24" rx="10"/><text class="fig-lit-sub" x="186" y="178" text-anchor="middle">Capital handover</text>
<circle class="fig-token" cx="451" cy="163" r="6"/>
<rect class="fig-lit-box c-blue" x="376" y="129" width="150" height="24" rx="10"/><text class="fig-lit-sub" x="451" y="145" text-anchor="middle">Condition monitoring</text>
<circle class="fig-token" cx="416" cy="196" r="6"/>
<rect class="fig-box" x="338" y="162" width="156" height="24" rx="10"/><text class="fig-box-sub" x="416" y="178" text-anchor="middle">Audit-ready reporting</text>
