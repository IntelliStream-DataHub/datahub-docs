<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" class="fig-industrial-revolutions" role="img" aria-label="A timeline of four industrial revolutions: mechanisation around 1780, mass production around 1870, automation around 1970, and today's contextual, connected operations.">
<text class="fig-title" x="20" y="24">Four industrial revolutions</text>
<text class="fig-sub" x="20" y="44">Each one arrived when a new foundation made a new kind of operation possible.</text>
<line class="fig-track" x1="20" y1="82" x2="740" y2="82"/>
<g class="fig-seq fig-d1"><circle class="fig-token" cx="104" cy="82" r="7"/><rect class="fig-box" x="20" y="104" width="168" height="92" rx="12"/><text class="fig-box-sub" x="104" y="124" text-anchor="middle">c. 1780</text><text class="fig-box-title" x="104" y="146" text-anchor="middle">Mechanisation</text><text class="fig-box-sub" x="104" y="168" text-anchor="middle">Steam and water power.</text><text class="fig-box-sub" x="104" y="183" text-anchor="middle">Machines replace muscle.</text></g>
<g class="fig-seq fig-d2"><circle class="fig-token" cx="288" cy="82" r="7"/><rect class="fig-box" x="204" y="104" width="168" height="92" rx="12"/><text class="fig-box-sub" x="288" y="124" text-anchor="middle">c. 1870</text><text class="fig-box-title" x="288" y="146" text-anchor="middle">Mass production</text><text class="fig-box-sub" x="288" y="168" text-anchor="middle">Electricity, assembly</text><text class="fig-box-sub" x="288" y="183" text-anchor="middle">lines and standard parts.</text></g>
<g class="fig-seq fig-d3"><circle class="fig-token" cx="472" cy="82" r="7"/><rect class="fig-box" x="388" y="104" width="168" height="92" rx="12"/><text class="fig-box-sub" x="472" y="124" text-anchor="middle">c. 1970</text><text class="fig-box-title" x="472" y="146" text-anchor="middle">Automation</text><text class="fig-box-sub" x="472" y="168" text-anchor="middle">Electronics, computers,</text><text class="fig-box-sub" x="472" y="183" text-anchor="middle">a controller per machine.</text></g>
<g class="fig-seq fig-d4"><circle class="fig-token" cx="656" cy="82" r="7"/><rect class="fig-lit-box c-blue" x="572" y="104" width="168" height="92" rx="12"/><text class="fig-lit-sub" x="656" y="124" text-anchor="middle">now</text><text class="fig-lit-title" x="656" y="146" text-anchor="middle">Context</text><text class="fig-lit-sub" x="656" y="168" text-anchor="middle">The whole operation</text><text class="fig-lit-sub" x="656" y="183" text-anchor="middle">modelled as one system.</text></g>
<text class="fig-box-sub" x="20" y="232">Power, then standardisation, then computation — and now context: a machine-readable</text><text class="fig-box-sub" x="20" y="250">model of the operation itself, which is the part most organisations do not yet have.</text>
</svg>