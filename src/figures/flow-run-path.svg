<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" class="fig-flow-run-path" role="img" aria-label="One run of an hourly flow. The 14:00 schedule tick starts a run over 13:00 to 14:00. Read timeseries reads pump-12.temp and sends it through its success outcome to two steps. Clamp lowers values above 120 and sends the result through success to Write timeseries, which writes pump-12.temp_clean. Threshold periods finds periods above 90 lasting at least 10 minutes and sends them through its alarms outcome to Write events, which writes one event per period; its success outcome is ended there. Underneath, the run's history records every read, route and write.">
<text class="fig-title" x="20" y="24">One run of a flow, from trigger to history</text>
<text class="fig-sub" x="20" y="44">Every hour: read the hour just ended, clean it, and record each period the pump ran hot.</text>
<rect class="fig-centre" x="20" y="82" width="110" height="56" rx="12"/><text class="fig-centre-title" x="75" y="105" text-anchor="middle">Trigger</text><text class="fig-centre-sub" x="75" y="123" text-anchor="middle">14:00 tick</text>
<path class="fig-edge" d="M130 110 L170 110" fill="none"/>
<path class="fig-centre" d="M170 105 L180 110 L170 115 z"/>
<text class="fig-box-sub" x="75" y="156" text-anchor="middle">window</text>
<text class="fig-box-sub" x="75" y="170" text-anchor="middle">13:00 to 14:00</text>
<rect class="fig-lit-box c-blue" x="180" y="82" width="140" height="56" rx="12"/><text class="fig-lit-title" x="250" y="105" text-anchor="middle">Read timeseries</text><text class="fig-lit-sub" x="250" y="123" text-anchor="middle">pump-12.temp</text>
<text class="fig-box-sub" x="326" y="101">success</text>
<path class="fig-exit-path fig-flow" d="M320 110 L390 110" fill="none"/>
<path class="fig-centre" d="M390 105 L400 110 L390 115 z"/>
<path class="fig-exit-path fig-flow" d="M362 110 L362 230 L390 230" fill="none"/>
<path class="fig-centre" d="M390 225 L400 230 L390 235 z"/>
<rect class="fig-box" x="400" y="82" width="150" height="56" rx="12"/><text class="fig-box-title" x="475" y="105" text-anchor="middle">Clamp</text><text class="fig-box-sub" x="475" y="123" text-anchor="middle">above 120 becomes 120</text>
<rect class="fig-box" x="400" y="202" width="150" height="56" rx="12"/><text class="fig-box-title" x="475" y="225" text-anchor="middle">Threshold periods</text><text class="fig-box-sub" x="475" y="243" text-anchor="middle">above 90, 10 min or more</text>
<text class="fig-box-sub" x="575" y="101" text-anchor="middle">success</text>
<path class="fig-exit-path fig-flow" d="M550 110 L590 110" fill="none"/>
<path class="fig-centre" d="M590 105 L600 110 L590 115 z"/>
<text class="fig-box-sub" x="575" y="221" text-anchor="middle">alarms</text>
<path class="fig-exit-path fig-flow" d="M550 230 L590 230" fill="none"/>
<path class="fig-centre" d="M590 225 L600 230 L590 235 z"/>
<rect class="fig-lit-box c-green" x="600" y="82" width="140" height="56" rx="12"/><text class="fig-lit-title" x="670" y="105" text-anchor="middle">Write timeseries</text><text class="fig-lit-sub" x="670" y="123" text-anchor="middle">pump-12.temp_clean</text>
<rect class="fig-lit-box c-green" x="600" y="202" width="140" height="56" rx="12"/><text class="fig-lit-title" x="670" y="225" text-anchor="middle">Write events</text><text class="fig-lit-sub" x="670" y="243" text-anchor="middle">one per hot period</text>
<line class="fig-track" x1="475" y1="258" x2="475" y2="280"/>
<line class="fig-edge" x1="465" y1="280" x2="485" y2="280"/>
<text class="fig-box-sub" x="492" y="284">success, ended here</text>
<rect class="fig-exit-box" x="20" y="300" width="720" height="40" rx="10"/>
<text class="fig-exit-title" x="36" y="324">Run history</text>
<text class="fig-exit-sub" x="130" y="324">every read, route and write, item by item, kept with the run for 90 days by default</text>
</svg>
