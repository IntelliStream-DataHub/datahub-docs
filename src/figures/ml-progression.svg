<text class="fig-box-sub" x="520" y="274">the ringed points are the only ones that</text>
<text class="fig-box-sub" x="520" y="290">matter: move them and the boundary moves</text>
<text class="fig-sub" x="20" y="312">Start at the left. Move right only when the question demands it, because everything you gain</text>
<text class="fig-sub" x="20" y="330">going right is paid for in how easily you can explain the answer afterwards.</text>
