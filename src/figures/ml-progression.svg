<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" class="fig-ml-progression" role="img" aria-label="Three panels. First, linear regression fits a straight line through scattered points to predict a number. Second, logistic regression bends that line into an S-curve between no and yes, to predict a probability. Third, a support vector machine separates two groups of points with the line that leaves the widest margin, resting on a few points at the edges.">
<text class="fig-title" x="20" y="24">The same idea, answering three harder questions</text>
<text class="fig-sub" x="20" y="44">Fit a line. Bend it into a probability. Then use it as a boundary, and make the gap as wide as possible.</text>
<text class="fig-box-title" x="20" y="78">Linear regression</text>
<text class="fig-box-sub" x="20" y="96">how much? · days until service</text>
<line class="fig-track" x1="20" y1="252" x2="240" y2="252"/>
<text class="fig-box-title" x="270" y="78">Logistic regression</text>
<text class="fig-box-sub" x="270" y="96">how likely? · chance it fails this month</text>
<line class="fig-track" x1="270" y1="252" x2="490" y2="252"/>
<text class="fig-box-title" x="520" y="78">Support vector machine</text>
<text class="fig-box-sub" x="520" y="96">which side? · healthy or failing</text>
<line class="fig-track" x1="520" y1="252" x2="740" y2="252"/>
