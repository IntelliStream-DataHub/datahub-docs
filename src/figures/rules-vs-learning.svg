<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" class="fig-rules-learning" role="img" aria-label="On the left, a person writes a threshold rule which then makes decisions. On the right, examples of what happened are used to train a model, which works the rule out and then makes decisions.">
<text class="fig-title" x="20" y="24">Two ways to get a decision out of a measurement</text>
<text class="fig-sub" x="20" y="44">Both end in the same place. They differ entirely in what you have to know beforehand.</text>
<text class="fig-box-title" x="20" y="82">You write the rule</text>
<text class="fig-box-title" x="400" y="82">The rule is learned from examples</text>
<rect class="fig-box" x="20" y="100" width="150" height="56" rx="12"/><text class="fig-box-title" x="95" y="124" text-anchor="middle">An expert</text><text class="fig-box-sub" x="95" y="141" text-anchor="middle">who knows the threshold</text>
<path class="fig-exit-path fig-flow" d="M170 128 L199 128" fill="none"/>
<path class="fig-centre" d="M199 123 L210 128 L199 133 z"/>
<rect class="fig-box" x="216" y="100" width="144" height="56" rx="12"/><text class="fig-box-sub" x="288" y="124" text-anchor="middle">if vibration &gt; 4.5</text><text class="fig-box-sub" x="288" y="141" text-anchor="middle">then raise an alarm</text>
<text class="fig-box-sub" x="20" y="186">Readable by anyone, and wrong the moment the</text>
<text class="fig-box-sub" x="20" y="202">machine, the duty or the season changes.</text>
<rect class="fig-box" x="400" y="100" width="164" height="56" rx="12"/><text class="fig-box-title" x="482" y="124" text-anchor="middle">What happened before</text><text class="fig-box-sub" x="482" y="141" text-anchor="middle">readings, and how each ended</text>
<path class="fig-exit-path fig-flow" d="M564 128 L593 128" fill="none"/>
<path class="fig-centre" d="M593 123 L604 128 L593 133 z"/>
<rect class="fig-lit-box c-blue" x="610" y="100" width="130" height="56" rx="12"/><text class="fig-lit-title" x="675" y="124" text-anchor="middle">A model</text><text class="fig-lit-sub" x="675" y="141" text-anchor="middle">the rule, worked out</text>
<text class="fig-box-sub" x="400" y="186">Nobody had to know the threshold, and it can be</text>
<text class="fig-box-sub" x="400" y="202">relearned when the plant changes. Harder to read.</text>
<rect class="fig-exit-box" x="20" y="226" width="720" height="56" rx="14"/><text class="fig-exit-title" x="40" y="250">Machine learning is the right-hand lane, and that is the whole of it.</text><text class="fig-exit-sub" x="40" y="270">Everything below is a different answer to one question: what shape is the rule allowed to be?</text>
</svg>