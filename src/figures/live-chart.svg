<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" class="fig-live-chart" role="img" aria-label="A chart panel over the quick range Last 30 minutes, with two series plotted on one axis. Motor current, labelled by a blue chip, and throughput, labelled by an orange chip, run parallel across the left two thirds of the chart, rising and falling together. An orange marker labelled Divergence sits about two thirds of the way along: from that moment motor current climbs while throughput falls, and the gap between the two traces widens. The right-hand portion of the plot is a shaded Live region where new readings arrive one after another as staggered datapoints on both traces, and an arrow past the now label shows the axis extending as time passes. Three notes below the chart read: two series, one axis, motor current and throughput move together minute by minute; then they diverge, current climbs while throughput falls, which is the finding; and Live extends the axis with a 2-minute, 15-minute, or growing window.">
<text class="fig-title" x="20" y="24">Two series on one axis, still arriving</text>
<text class="fig-sub" x="20" y="44">The pairing is the analysis — and Live keeps the right-hand edge moving.</text>

