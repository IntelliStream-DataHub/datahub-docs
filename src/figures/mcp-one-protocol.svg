<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" class="fig-mcp-one-protocol" role="img" aria-label="Two panels. On the left, three AI clients each wired to three systems by a separate integration, nine lines in total. On the right, the same three clients and three systems connected through one shared protocol in the middle, six connections and none of them bespoke.">
<text class="fig-title" x="20" y="24">One protocol instead of one integration per pair</text>
<text class="fig-sub" x="20" y="44">Any client that speaks MCP can use any system that serves it. The system’s owner writes the server once.</text>
<text class="fig-box-title" x="185" y="78" text-anchor="middle">Before: bespoke each time</text>
<text class="fig-box-title" x="575" y="78" text-anchor="middle">With a shared protocol</text>
<line class="fig-track" x1="124" y1="117" x2="246" y2="117"/>
<line class="fig-track" x1="124" y1="117" x2="246" y2="167"/>
<line class="fig-track" x1="124" y1="117" x2="246" y2="217"/>
<line class="fig-track" x1="124" y1="167" x2="246" y2="117"/>
<line class="fig-track" x1="124" y1="167" x2="246" y2="167"/>
<line class="fig-track" x1="124" y1="167" x2="246" y2="217"/>
<line class="fig-track" x1="124" y1="217" x2="246" y2="117"/>
<line class="fig-track" x1="124" y1="217" x2="246" y2="167"/>
<line class="fig-track" x1="124" y1="217" x2="246" y2="217"/>
<rect class="fig-box" x="20" y="100" width="104" height="34" rx="10"/><text class="fig-box-sub" x="72" y="121" text-anchor="middle">Assistant</text>
<rect class="fig-box" x="20" y="150" width="104" height="34" rx="10"/><text class="fig-box-sub" x="72" y="171" text-anchor="middle">Agent</text>
<rect class="fig-box" x="20" y="200" width="104" height="34" rx="10"/><text class="fig-box-sub" x="72" y="221" text-anchor="middle">Copilot</text>
<rect class="fig-box" x="246" y="100" width="104" height="34" rx="10"/><text class="fig-box-sub" x="298" y="121" text-anchor="middle">DataHub</text>
<rect class="fig-box" x="246" y="150" width="104" height="34" rx="10"/><text class="fig-box-sub" x="298" y="171" text-anchor="middle">CMMS</text>
<rect class="fig-box" x="246" y="200" width="104" height="34" rx="10"/><text class="fig-box-sub" x="298" y="221" text-anchor="middle">Historian</text>
<text class="fig-box-sub" x="185" y="266" text-anchor="middle">3 clients × 3 systems = 9 integrations to write and maintain</text>
<text class="fig-box-sub" x="185" y="284" text-anchor="middle">add a fourth system and you write three more</text>
<rect class="fig-centre" x="548" y="100" width="68" height="134" rx="14"/>
<text class="fig-centre-title" x="582" y="172" text-anchor="middle">MCP</text>
<path class="fig-exit-path fig-flow" d="M514 117 L548 117" fill="none"/>
<path class="fig-exit-path fig-flow" d="M616 117 L650 117" fill="none"/>
<path class="fig-exit-path fig-flow" d="M514 167 L548 167" fill="none"/>
<path class="fig-exit-path fig-flow" d="M616 167 L650 167" fill="none"/>
<path class="fig-exit-path fig-flow" d="M514 217 L548 217" fill="none"/>
<path class="fig-exit-path fig-flow" d="M616 217 L650 217" fill="none"/>
<rect class="fig-box" x="410" y="100" width="104" height="34" rx="10"/><text class="fig-box-sub" x="462" y="121" text-anchor="middle">Assistant</text>
<rect class="fig-box" x="410" y="150" width="104" height="34" rx="10"/><text class="fig-box-sub" x="462" y="171" text-anchor="middle">Agent</text>
<rect class="fig-box" x="410" y="200" width="104" height="34" rx="10"/><text class="fig-box-sub" x="462" y="221" text-anchor="middle">Copilot</text>
<rect class="fig-box" x="650" y="100" width="90" height="34" rx="10"/><text class="fig-box-sub" x="695" y="121" text-anchor="middle">DataHub</text>
<rect class="fig-box" x="650" y="150" width="90" height="34" rx="10"/><text class="fig-box-sub" x="695" y="171" text-anchor="middle">CMMS</text>
<rect class="fig-box" x="650" y="200" width="90" height="34" rx="10"/><text class="fig-box-sub" x="695" y="221" text-anchor="middle">Historian</text>
<text class="fig-box-sub" x="575" y="266" text-anchor="middle">3 clients + 3 systems = 6 connections, none of them bespoke</text>
<text class="fig-box-sub" x="575" y="284" text-anchor="middle">add a fourth system and it serves every client on day one</text>
<text class="fig-sub" x="20" y="316">DataHub sits on the right-hand side: it publishes its tools once, and an assistant, an agent</text>
<text class="fig-sub" x="20" y="334">you wrote or a coding tool all reach them the same way, with nothing written for any one of them.</text>
</svg>