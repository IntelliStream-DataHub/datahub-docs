<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Two signals with the same shape. The second lags the first; sliding it back by the measured lag makes the two line up.">
<style>
    text { font-family: Manrope, 'Open Sans', Helvetica, Arial, sans-serif; }   /* no fill: a type rule beats every fill="" attribute */
    @keyframes slide {
      0%, 18%   { transform: translateX(0) }
      38%, 72%  { transform: translateX(-58px) }
      92%, 100% { transform: translateX(0) }
    }
    @keyframes showAligned {
      0%, 34%  { opacity: 0 }
      42%, 70% { opacity: 1 }
      78%, 100%{ opacity: 0 }
    }
    @keyframes showOffset {
      0%, 20%  { opacity: 1 }
      34%, 76% { opacity: 0 }
      90%,100% { opacity: 1 }
    }
    .slider  { animation: slide 7s ease-in-out infinite; }
    .aligned { opacity: 0; animation: showAligned 7s ease-in-out infinite; }
    .offset  { animation: showOffset 7s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .slider { animation: none; transform: translateX(-58px) }
      .aligned { animation: none; opacity: 1 }
      .offset { animation: none; opacity: 0 }
    }
    </style>
