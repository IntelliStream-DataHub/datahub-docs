<style>@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }text { font-family: Manrope, 'Open Sans', Helvetica, Arial, sans-serif; font-size: 13px; }.lit { opacity: 0; }.flow { stroke-dasharray: 6 6; }@keyframes lit0 { 0%,6% {opacity:0} 10%,72% {opacity:1} 80%,100% {opacity:0} }.hop0 { animation: lit0 7s steps(1, end) infinite; }@keyframes dim0 { 0%,6% {opacity:1} 10%,72% {opacity:0} 80%,100% {opacity:1} }.base0 { animation: dim0 7s steps(1, end) infinite; }@keyframes lit1 { 0%,16% {opacity:0} 20%,72% {opacity:1} 80%,100% {opacity:0} }.hop1 { animation: lit1 7s steps(1, end) infinite; }@keyframes dim1 { 0%,16% {opacity:1} 20%,72% {opacity:0} 80%,100% {opacity:1} }.base1 { animation: dim1 7s steps(1, end) infinite; }@keyframes lit2 { 0%,26% {opacity:0} 30%,72% {opacity:1} 80%,100% {opacity:0} }.hop2 { animation: lit2 7s steps(1, end) infinite; }@keyframes dim2 { 0%,26% {opacity:1} 30%,72% {opacity:0} 80%,100% {opacity:1} }.base2 { animation: dim2 7s steps(1, end) infinite; }@keyframes lit3 { 0%,36% {opacity:0} 40%,72% {opacity:1} 80%,100% {opacity:0} }.hop3 { animation: lit3 7s steps(1, end) infinite; }@keyframes dim3 { 0%,36% {opacity:1} 40%,72% {opacity:0} 80%,100% {opacity:1} }.base3 { animation: dim3 7s steps(1, end) infinite; }@keyframes march { to { stroke-dashoffset: -24 } }.flow { animation: march 1.2s linear infinite; }@media (prefers-reduced-motion: reduce) { .lit { opacity: 1; animation: none } .flow { animation: none } }</style>
