<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="A chart of effort per question answered. Without a model the cost stays flat and drifts upward. With a model the first question costs more, then the cost falls steeply. The widening gap between the two lines is the cost of doing nothing.">
<style>
    text { font-family: Manrope, 'Open Sans', Helvetica, Arial, sans-serif; }   /* no fill: a type rule beats every fill="" attribute */
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes fadeUp { 0%,38% {opacity:0} 62%,100% {opacity:.20} }
    @keyframes appear { 0%,55% {opacity:0} 75%,100% {opacity:1} }
    .line { stroke-dasharray: 900; stroke-dashoffset: 900;
             animation: draw 3.2s ease-out forwards; }
    .line2 { animation-delay: .5s; }
    .gap { opacity: 0; animation: fadeUp 6s ease-out forwards; }
    .note { opacity: 0; animation: appear 6s ease-out forwards; }
    @media (prefers-reduced-motion: reduce) {
      .line { stroke-dashoffset: 0; animation: none }
      .gap { opacity: .20; animation: none }
      .note { opacity: 1; animation: none }
    }
    </style>
<text x="20" y="26" font-weight="800" font-size="15" fill="#005984">Effort to answer each successive question</text>
<text x="20" y="46" font-size="12.5" fill="#5c6b75">The gap between the lines is what doing nothing costs — and it widens.</text>
<line x1="92" y1="288" x2="612" y2="288" stroke="#c2d5dd" stroke-width="1.5"/>
<line x1="92" y1="70" x2="92" y2="288" stroke="#c2d5dd" stroke-width="1.5"/>
<text x="84" y="76" text-anchor="end" font-size="11.5" fill="#5c6b75">high</text>
<text x="84" y="288" text-anchor="end" font-size="11.5" fill="#5c6b75">low</text>
<text x="352" y="322" text-anchor="middle" font-size="12" fill="#5c6b75">1st question  →  10th question</text>
<polygon class="gap" points="149.8,126.5 207.6,123.3 265.3,121.7 323.1,120.1 380.9,116.8 438.7,115.2 496.4,113.6 554.2,110.4 612.0,108.8 612.0,254.1 554.2,252.5 496.4,247.6 438.7,242.8 380.9,234.7 323.1,223.4 265.3,207.3 207.6,184.7 149.8,145.9" fill="#f6783c"/>
<polyline class="line" points="92.0,126.5 149.8,126.5 207.6,123.3 265.3,121.7 323.1,120.1 380.9,116.8 438.7,115.2 496.4,113.6 554.2,110.4 612.0,108.8" fill="none" stroke="#5c6b75" stroke-width="3" stroke-linecap="round"/>
<polyline class="line line2" points="92.0,81.3 149.8,145.9 207.6,184.7 265.3,207.3 323.1,223.4 380.9,234.7 438.7,242.8 496.4,247.6 554.2,252.5 612.0,254.1" fill="none" stroke="#005984" stroke-width="3" stroke-linecap="round"/>
<text x="620" y="113" font-size="12.5" font-weight="700" fill="#5c6b75">no model</text>
<text x="620" y="258" font-size="12.5" font-weight="700" fill="#005984">with a model</text>
<g class="note"><circle cx="92" cy="81" r="5" fill="#005984"/><text x="104" y="73" font-size="12" font-weight="700" fill="#005984">the first question costs more</text><circle cx="150" cy="146" r="5" fill="#0f7a3d"/><text x="162" y="136" font-size="12" font-weight="700" fill="#0f7a3d">break-even</text></g>
</svg>